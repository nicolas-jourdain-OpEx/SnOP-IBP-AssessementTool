// Versions persistence (localStorage) - Save / Load multiple versions
// ==============================
const STORAGE_VERSION = 1;

const getStorageKey = (user) => {
  const email = (user?.email || "anonymous").toLowerCase().trim();
  const company = (user?.company || "").toLowerCase().trim();
  return `snop_assessment_versions_v${STORAGE_VERSION}:${company}:${email}`;
};

const readVersions = () => {
  try {
    const key = getStorageKey(user);
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error("readVersions failed", e);
    return [];
  }
};

const writeVersions = (versions) => {
  const key = getStorageKey(user);
  localStorage.setItem(key, JSON.stringify(versions));
};

const hasSavedVersions = () => {
  try {
    return readVersions().length > 0;
  } catch {
    return false;
  }
};

// Save a NEW version (snapshot)
const saveAssessmentVersion = () => {
  if (!user?.email) {
    alert("Please login before saving.");
    return false;
  }

  const name = window.prompt("Name this saved version (e.g., 'Workshop Feb 2026'):", "");
  if (name === null) return false; // cancelled
  const trimmed = name.trim() || `Saved ${new Date().toLocaleString()}`;

  try {
    const versions = readVersions();
    const id = `${Date.now()}`;
    versions.unshift({
      id,
      name: trimmed,
      savedAt: new Date().toISOString(),
      answers, // snapshot of answers
    });

    // keep max 20 versions
    writeVersions(versions.slice(0, 20));
    alert("Version saved ✅");
    return true;
  } catch (e) {
    console.error("saveAssessmentVersion failed", e);
    alert("Impossible de sauvegarder (localStorage bloqué ou plein).");
    return false;
  }
};

// Load a chosen version
const loadAssessmentVersion = () => {
  if (!user?.email) {
    alert("Please login before loading.");
    return false;
  }

  const versions = readVersions();
  if (versions.length === 0) {
    alert("No saved version found.");
    return false;
  }

  const menu = versions
    .map((v, i) => `${i + 1}) ${v.name}  [${new Date(v.savedAt).toLocaleString()}]`)
    .join("\n");

  const choice = window.prompt("Choose a version number to load:\n\n" + menu, "1");
  if (choice === null) return false;

  const idx = parseInt(choice, 10) - 1;
  if (Number.isNaN(idx) || idx < 0 || idx >= versions.length) {
    alert("Invalid choice.");
    return false;
  }

  setAnswers(versions[idx].answers || {});
  alert("Version loaded ✅");
  return true;
};

// Optional: delete all versions
const clearAllSavedVersions = () => {
  if (!user?.email) return;
  if (!window.confirm("Delete ALL saved versions for this user?")) return;
  localStorage.removeItem(getStorageKey(user));
  alert("Saved versions deleted.");
};
// ==============================
// Excel Export: Summary + Detailed Breakdown + Improvement Plan
// ==============================
const exportExcelReport = () => {
    // 1) Check library
    if (!window.XLSX) {
        alert("Excel export not available: XLSX library not loaded. Check the <script src=...xlsx...> in <head>.");
        return;
    }
    const XLSX = window.XLSX;

    // 2) Compute up-to-date category scores
    const catScores = getCategoryScores();

    // 3) Build category numbering (1) Name - based on categories[] order
    const categoryIndex = Object.fromEntries(categories.map((c, i) => [c, i + 1]));

    // 4) Metadata
    const now = new Date();
    const dateStr = now.toLocaleDateString();
    const isoDate = now.toISOString().slice(0, 10);
    const fileName = `SOP_Maturity_Report_${isoDate}.xlsx`;

    // =========================
    // SHEET 1: SUMMARY (like PDF header)
    // =========================
    const summaryAOA = [
        ["S&OP / IBP Maturity Assessment Result"],
        [],
        ["Company", user?.company || ""],
        ["User", user?.email || ""],
        ["Date", dateStr],
        ["Powered by", "Opex-performance.com"],
        [],
        ["Global Maturity Score (/5)", Number(globalScore) || 0],
        [],
        ["#", "Category", "Score (/5)"],
        ...categories.map((cat, i) => [
            i + 1,
            cat,
            Number(catScores[cat] || 0)
        ]),
    ];

    const wsSummary = XLSX.utils.aoa_to_sheet(summaryAOA);
    wsSummary["!cols"] = [
        { wch: 6 },   // #
        { wch: 50 },  // Category
        { wch: 12 },  // Score
    ];

    // =========================
    // SHEET 2: DETAILED BREAKDOWN (like PDF table)
    // =========================
    const breakdownAOA = [
        ["Category #", "Category", "Question", "Score", "Selected Answer", "Rational", "User Comment"]
    ];

    // IMPORTANT: adapt the variable name if your data is called assessmentData
    const allQuestions = assessmentData || data;

    allQuestions.forEach((q) => {
        const ans = answers[q.id];
        breakdownAOA.push([
            categoryIndex[q.category] || "",
            q.category || "",
            q.question || "",
            ans ? ans.score : "",
            ans ? (ans.text || "") : "Not Answered",
            ans ? (ans.rational || "") : "",
            ans ? (ans.comment || "") : "",
        ]);
    });

    const wsBreakdown = XLSX.utils.aoa_to_sheet(breakdownAOA);
    wsBreakdown["!cols"] = [
        { wch: 10 },  // Category #
        { wch: 35 },  // Category
        { wch: 70 },  // Question
        { wch: 8 },   // Score
        { wch: 30 },  // Selected Answer
        { wch: 45 },  // Rational
        { wch: 35 },  // User Comment
    ];

    // =========================
    // SHEET 3: IMPROVEMENT PLAN (like plan screen)
    // =========================
    const gaps = [];

    allQuestions.forEach((q) => {
        const ans = answers[q.id];
        const score = ans ? ans.score : 0;

        // Same logic as plan: anything < 5 is a gap
        if (score < 5) {
            gaps.push({
                category: q.category,
                question: q.question,
                userScore: score,
                userAnswer: ans ? (ans.text || "") : "Not Answered",
                rational: ans ? (ans.rational || "") : "",
                comment: ans ? (ans.comment || "") : "",
            });
        }
    });

    // Sort: lowest score first, then category order
    gaps.sort((a, b) => {
        if (a.userScore !== b.userScore) return a.userScore - b.userScore;
        return (categoryIndex[a.category] || 999) - (categoryIndex[b.category] || 999);
    });

    const planAOA = [
        ["Priority", "Category #", "Category", "Question", "Current Score", "Target Score", "Current Answer", "Rational", "User Comment"]
    ];

    gaps.forEach((item, idx) => {
        planAOA.push([
            idx + 1,
            categoryIndex[item.category] || "",
            item.category || "",
            item.question || "",
            item.userScore,
            5,
            item.userAnswer || "",
            item.rational || "",
            item.comment || "",
        ]);
    });

    const wsPlan = XLSX.utils.aoa_to_sheet(planAOA);
    wsPlan["!cols"] = [
        { wch: 9 },   // Priority
        { wch: 10 },  // Category #
        { wch: 35 },  // Category
        { wch: 70 },  // Question
        { wch: 12 },  // Current Score
        { wch: 12 },  // Target Score
        { wch: 30 },  // Current Answer
        { wch: 45 },  // Rational
        { wch: 35 },  // User Comment
    ];

    // =========================
    // Create workbook + download
    // =========================
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsSummary, "Summary");
    XLSX.utils.book_append_sheet(wb, wsBreakdown, "Detailed Breakdown");
    XLSX.utils.book_append_sheet(wb, wsPlan, "Improvement Plan");

    XLSX.writeFile(wb, fileName);
};

const categoryIndex = useMemo(() => {

                    if (!r) return;
                    
                    const xCenter = r.xCenter;
                    const yCenter = r.yCenter;
                    const radius = r.drawingArea;

                    // Draw circles
                    const drawZone = (radiusVal, color) => {
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(xCenter, yCenter, radiusVal, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.restore();
                    };

                    // Scale is 0-5. We need pixel radius for values 2, 4, 5
                    const r5 = r.getDistanceFromCenterForValue(5);
                    const r4 = r.getDistanceFromCenterForValue(4);
                    const r2 = r.getDistanceFromCenterForValue(2);

                    drawZone(r5, 'rgba(34, 197, 94, 0.1)'); // Green (outer)
                    drawZone(r4, 'rgba(245, 158, 11, 0.15)'); // Orange

{/* --- NEW: Global Maturity Score + Category Summary (for PDF header) --- */}

// --- Category numbering helper (same as assessment order) ---
const categoryIndex = useMemo(() => {
    return Object.fromEntries(categories.map((c, i) => [c, i + 1]));
}, [categories]);

const catLabel = (cat) => {
    const n = categoryIndex[cat];
    return n ? `${n}) ${cat}` : cat;
};
            
            // Filter and Sort Gaps
            const gaps = useMemo(() => {

                    if (score < 5) {

                            ...q,
                            userScore: score,
                            userAnswer: ans ? ans.text : "Not Answered",
                            gap: 5 - score
                        });
                    }
                });
                return items.sort((a, b) => b.gap - a.gap); // Lowest scores first
            }, [data, answers]);

            const getRecommendation = (id, score) => {
  // 1) Use the coded DB first
  const rec = recommendationDB?.[id]?.[score];
  if (rec) return rec;

  // 2) Fallback (optional)
  const question = data.find(q => q.id === id);
  if (!question) return "No data";
  const option = question.options.find(o => o.score === score);
  return option?.recommendation || "Review standard practices to improve this area.";
};

const printPlan = () => {
    const originalTitle = document.title;

    // ⚠️ Ne mets PAS ".pdf" ici : le navigateur l’ajoute souvent automatiquement
    const newTitle = "S&OP _ IBP Improvement Plan - by Opex Performance";

        document.title = originalTitle;

    };

            return (

        // --- WRAPPER FOR CHART.JS ---
        // Simple wrapper to handle ChartJS instantiation in React without build steps
        const ReactChartjs2 = ({ type, data, options, plugins = [] }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                
                // Destroy previous instance
                if (chartRef.current) {
                    chartRef.current.destroy();
                }

                // Create new instance
                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: type,
                    data: data,
                    options: {
                        ...options,
                        responsive: true,
                        maintainAspectRatio: false,
                    },
                    plugins: plugins
                });

                return () => {
                    if (chartRef.current) chartRef.current.destroy();
                };
            }, [data, options]);

            return <canvas ref={canvasRef} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
